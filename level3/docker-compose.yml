services:
  nginx:
    image: nginx
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - server1
      - server2
      - server3
  server1:
    build: ./server
    environment:
      - SERVER_NAME=first server
    ports:
      - "5001:3000"
    # env_file:
    #   - ./server/.env

  server2:
    build: ./server
    environment:
      - SERVER_NAME=second server
    ports:
      - "5002:3000"
    # env_file:
    #   - ./server/.env

  server3:
    build: ./server
    environment:
      - SERVER_NAME=third server
    ports:
      - "5003:3000"
    # env_file:
    #   - ./server/.env

